# Publishes the `accumulo-access` crate to crates.io and cuts a GitHub release.
#
# IMPORTANT: the name of this file is part of the crates.io trusted publisher
# configuration. Renaming or moving it stops publishing from working until the
# configuration is updated at
# https://crates.io/crates/accumulo-access/settings -> Trusted Publishing.
#
# To release:
#
#   1. Bump `version` in accumulo-access/Cargo.toml (and the path dependency in
#      wasm-accumulo-access/Cargo.toml) on main.
#   2. git tag v$VERSION && git push origin v$VERSION
#
# The workflow refuses to run if the tag and Cargo.toml disagree. It can also be
# started by hand from the Actions tab, which tags the current commit for you,
# and has a dry-run mode that checks and packages without publishing.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and package the crate, but don't publish or tag"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish accumulo-access
    runs-on: ubuntu-latest

    # Uncomment to require a manual approval before anything is published. It
    # needs an environment named `release` under Settings -> Environments with
    # the reviewers you want; add the same name to the trusted publisher
    # configuration on crates.io.
    # environment: release

    permissions:
      contents: write  # create the tag and the GitHub release
      id-token: write  # exchange an OIDC token for a crates.io token

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release notes are generated from history

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the version to release
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "accumulo-access") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read the accumulo-access version from cargo metadata"
            exit 1
          fi

          # A tag push has to agree with Cargo.toml, otherwise we would publish
          # something other than what the tag names.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match accumulo-access $version (expected v$version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing accumulo-access $version as v$version"

      - name: Check whether the version is already on crates.io
        id: crates_io
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "accumulo-access release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/accumulo-access/${VERSION}")"
          case "$status" in
            200)
              # Not an error: it lets a re-run finish a release whose publish
              # succeeded but whose later steps did not. Versions are immutable,
              # so there is nothing to overwrite.
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::accumulo-access ${VERSION} is already published; publishing will be skipped"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected HTTP $status from crates.io while checking the published versions"
              exit 1
              ;;
          esac

      - name: Test
        run: cargo test --workspace --verbose

      # The `caching` feature is on by default, so a break in the uncached path
      # is otherwise invisible until someone depends on it.
      - name: Test without default features
        run: cargo test -p accumulo-access --no-default-features --verbose

      - name: Package
        run: cargo publish -p accumulo-access --dry-run

      - name: Authenticate with crates.io
        id: auth
        if: ${{ steps.crates_io.outputs.published == 'false' && !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: ${{ steps.crates_io.outputs.published == 'false' && !inputs.dry_run }}
        run: cargo publish -p accumulo-access
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, leaving it alone"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            # Started by hand: tag this commit as part of creating the release.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALREADY_PUBLISHED: ${{ steps.crates_io.outputs.published }}
        run: |
          {
            echo "## accumulo-access $VERSION"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: checked and packaged, nothing published or tagged."
            elif [ "$ALREADY_PUBLISHED" = "true" ]; then
              echo "- crates.io: already published, skipped"
              echo "- release: <https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG>"
            else
              echo "- crates.io: <https://crates.io/crates/accumulo-access/$VERSION>"
              echo "- release: <https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
